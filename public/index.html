<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossroads on Turnkey</title>
<style>
  /* Color carries meaning: teal = settled on the ledger (Instant), amber = waiting on a blockchain
     (On-chain), indigo = something the vault or Turnkey did. Everything else stays neutral. */
  :root {
    --bg: #e8ecf0; --panel: #ffffff; --soft: #f3f5f8; --ink: #16212c; --muted: #566575; --line: #cbd3dc;
    --instant: #0b7a63; --instant-bg: #e1f3ed;
    --onchain: #95570a; --onchain-bg: #fbefdc;
    --vault: #3446c8; --vault-bg: #e7eafb;
    --err: #b42318; --ok: #0b7a63;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151c; --panel: #161f29; --soft: #1c2733; --ink: #e3e9ef; --muted: #93a2b1; --line: #2a3643;
      --instant: #45c9a2; --instant-bg: #12382f;
      --onchain: #eda94a; --onchain-bg: #3a2a12;
      --vault: #9aa6ff; --vault-bg: #232b55;
      --err: #ff8577; --ok: #45c9a2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151c; --panel: #161f29; --soft: #1c2733; --ink: #e3e9ef; --muted: #93a2b1; --line: #2a3643;
    --instant: #45c9a2; --instant-bg: #12382f;
    --onchain: #eda94a; --onchain-bg: #3a2a12;
    --vault: #9aa6ff; --vault-bg: #232b55;
    --err: #ff8577; --ok: #45c9a2;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }
  a { color: var(--vault); }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -.01em; }
  h2 { font-size: 1rem; margin: 0 0 .6rem; }
  h3 { font-size: .95rem; margin: 0 0 .3rem; }
  p { margin: 0 0 .6rem; }
  .muted, .note { color: var(--muted); }
  .note { font-size: .88rem; }
  :focus-visible { outline: 2px solid var(--vault); outline-offset: 2px; }

  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: .45rem .8rem; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
  button.danger { border-color: var(--err); color: var(--err); background: transparent; font-weight: 600; }
  button.link { border: 0; background: none; padding: 0; color: var(--vault); text-decoration: underline; text-underline-offset: 2px; }
  button.chip { padding: .15rem .6rem; border-radius: 999px; font-size: .88rem; }
  input, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .45rem .6rem; width: 100%; }
  label { display: grid; gap: .25rem; font-size: .9rem; color: var(--muted); }
  label > input, label > select { color: var(--ink); }

  /* login */
  .login { max-width: 34rem; margin: 12vh auto 3rem; padding: 0 1.25rem; }
  .lede { font-size: 1.05rem; color: var(--muted); max-width: 32rem; }
  .login-form { margin: 2rem 0; }
  .inline { display: flex; gap: .5rem; align-items: center; }
  .inline button { white-space: nowrap; flex: none; }
  .saved ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .4rem; }
  .saved code { color: var(--muted); margin-left: .4rem; }

  /* header */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; padding: .8rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; letter-spacing: -.01em; }
  .nets { display: flex; gap: .4rem; list-style: none; margin: 0; padding: 0; }
  .nets li { font-size: .8rem; padding: .1rem .55rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .who { margin-left: auto; display: flex; gap: 1rem; align-items: baseline; font-size: .9rem; }
  .who .name { font-weight: 600; }
  .standin, .offline { margin: 0; padding: .45rem 1.5rem; font-size: .85rem; background: var(--vault-bg); color: var(--ink); }
  .offline { background: var(--onchain-bg); }

  /* layout */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 24rem; gap: 2rem; max-width: 78rem; margin: 0 auto; padding: 1.5rem; align-items: start; }
  .trade > section { margin-bottom: 2rem; }

  /* balances */
  table.bal { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .bal th, .bal td { padding: .6rem .9rem; text-align: left; border-bottom: 1px solid var(--line); }
  .bal thead th { font-size: .85rem; font-weight: 500; color: var(--muted); background: var(--soft); }
  .bal tbody tr:last-child > * { border-bottom: 0; }
  .bal th[scope=row] { font-weight: 600; }
  .bal th[scope=row] .muted { font-weight: 400; font-size: .85rem; }
  .num { font-variant-numeric: tabular-nums; text-align: right !important; font-size: 1.05rem; }
  .bal thead th:not(:first-child) { text-align: right; }
  .pending { color: var(--onchain); font-weight: 600; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin: .9rem 0 0; font-size: .9rem; }
  .facts > div { display: contents; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }

  /* tags */
  .tag { display: inline-block; font-size: .75rem; font-weight: 600; padding: .05rem .45rem; border-radius: 4px; white-space: nowrap; }
  .tag.instant { color: var(--instant); background: var(--instant-bg); }
  .tag.onchain { color: var(--onchain); background: var(--onchain-bg); }

  /* in flight */
  .inflight { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
  .inflight li { display: flex; flex-wrap: wrap; gap: .3rem .7rem; align-items: baseline; padding: .55rem .8rem; background: var(--onchain-bg); border-radius: 6px; }
  .inflight a { margin-left: auto; font-size: .88rem; }

  /* action panel */
  .actions { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); padding: 0 .75rem; overflow-x: auto; }
  .tabs button { border: 0; border-radius: 0; background: none; padding: .75rem .7rem; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  #panel { padding: 1.1rem 1.1rem .6rem; }
  #panel form { display: grid; gap: .75rem; max-width: 36rem; }
  #panel form > button { justify-self: start; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .hint { font-size: .85rem; color: var(--muted); margin: 0; }
  .quote { margin: 0; }
  .picks { font-size: .88rem; color: var(--muted); margin: 0; }
  .bigaddr { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; padding: .8rem; background: var(--soft); border-radius: 6px; }
  .bigaddr code { font-size: 1.02rem; overflow-wrap: anywhere; }
  ul.plain { padding-left: 1.1rem; margin: .8rem 0; }
  .breakit { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px dashed var(--line); max-width: 36rem; }
  .status { margin: 0; min-height: 1.4em; font-size: .92rem; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  /* activity feed: the Instant vs On-chain contrast is the point of the demo */
  .feed { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .feed li { display: grid; grid-template-columns: 5.5rem 1fr auto 5.5rem; gap: .8rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid var(--line); }
  .feed .tag { justify-self: start; }
  .feed .how { font-size: .88rem; color: var(--muted); text-align: right; }
  .feed .instant .how strong { color: var(--instant); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .feed time, .hood time { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .feed .empty, .hood .empty { display: block; color: var(--muted); padding: .8rem 0; border: 0; }

  /* under the hood */
  .hood { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--vault); border-radius: 8px; padding: 1rem 1.1rem; }
  .hood ol { list-style: none; margin: .5rem 0 0; padding: 0; }
  .hood li { padding: .6rem 0; border-top: 1px solid var(--line); }
  .hood li p { margin: .15rem 0 0; font-size: .9rem; overflow-wrap: anywhere; }
  .hood .src { font-size: .75rem; font-weight: 700; }
  .hood .src-turnkey .src { color: var(--vault); }
  .hood .src-chain .src { color: var(--onchain); }
  .hood .src-ledger .src { color: var(--instant); }
  .hood .meta { display: flex; gap: .8rem; font-size: .8rem; color: var(--muted); }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    .hood { position: static; max-height: none; }
  }
  @media (max-width: 560px) {
    .fields { grid-template-columns: 1fr; }
    .feed li { grid-template-columns: 5rem 1fr; }
    .feed .how, .feed time { grid-column: 2; text-align: left; }
    .who { margin-left: 0; }
    .inline { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
