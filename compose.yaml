# What runs inside the ROFL machine. The deploy workflow rewrites the image line to the exact build it
# just pushed (pinned by digest) and commits it back, so this file always names the version running.
services:
  crossroads:
    image: "ghcr.io/wilwixqa1/crossroads-turnkey@sha256:e051153ec70f40d575ef02333698e88ee1eea9d71651f29b637e8c270e004c0c"
    platform: linux/amd64
    restart: always
    ports:
      - "8080:8080"
    environment:
      - VAULT_MODE=turnkey
      - LOGIN_MODE=google
      - GOOGLE_CLIENT_ID=295336183237-90umhku3e7jck9tktd5dikc6ru7bc2he.apps.googleusercontent.com
      - TURNKEY_ORG_ID=fa26e2cd-7656-4db6-b26f-3012c3b578e8
      # v2: the ledger restarted when the vault moved from the stand-in to Turnkey (stand-in addresses are not in the vault).
      - STATE_PATH=/data/v2/state.json
      - PORT=8080
    volumes:
      - crossroads-data:/data
      - /run/rofl-appd.sock:/run/rofl-appd.sock

volumes:
  crossroads-data:
