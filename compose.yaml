# What runs inside the ROFL machine. The deploy workflow rewrites the image line to the exact build it
# just pushed (pinned by digest) and commits it back, so this file always names the version running.
services:
  crossroads:
    image: "ghcr.io/wilwixqa1/crossroads-turnkey@sha256:a86a9f2f8710e11aa2b13a0c3c4c5d9d38ba5120c1292fb70ae73c83338f1b2e"
    platform: linux/amd64
    restart: always
    ports:
      - "8080:8080"
    environment:
      - VAULT_MODE=turnkey
      - LOGIN_MODE=google
      - GOOGLE_CLIENT_ID=295336183237-90umhku3e7jck9tktd5dikc6ru7bc2he.apps.googleusercontent.com
      - TURNKEY_ORG_ID=fa26e2cd-7656-4db6-b26f-3012c3b578e8
      # v2: the ledger restarted when the vault moved from the stand-in to Turnkey (stand-in addresses are not in the vault).
      - STATE_PATH=/data/v2/state.json
      - PORT=8080
      # Will's account (William Wendt) is the only one that may add liquidity to the swap pool.
      - LIQUIDITY_PROVIDER=0x03b5af4bc5e7a53cd45fc0001757058c24ccb1ec
      # After the Sept 26 machine loss: William Wendt and wil wix get their earlier vault addresses back on sign-in.
      # William's 0.1 Sepolia ETH deposit was credited again live on Sept 29, and its one-time credit removed from here.
      # NEXT PERSON: list a deposit here only for a ledger that lost it, and remove it once credited. On any later empty
      # ledger it would be credited again from the same transaction, even if the funds were withdrawn since.
      - 'RESTORE_ACCOUNTS=[{"account":"0x03b5af4bc5e7a53cd45fc0001757058c24ccb1ec","depositAddress":"0x0BeAc0e5b61A8DB1d211BB638f21dFf5AF2bCEA1"},{"account":"0xbac4de4f8241e6340d75affc454953ab50fa203b","depositAddress":"0x0D7Bb399D1FF2138Bc023934b8F462d823CcF0dC"}]'
    volumes:
      - crossroads-data:/data
      - /run/rofl-appd.sock:/run/rofl-appd.sock

volumes:
  crossroads-data:
